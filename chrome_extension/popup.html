<!doctype html>
<meta charset="utf-8">
<style>
  body { min-width: 300px; margin: 0; padding: 16px; font: 14px/1.5 "Microsoft YaHei UI", sans-serif; color: #222; }
  h1 { margin: 0 0 8px; font-size: 17px; }
  p { margin: 6px 0 12px; color: #666; }
  label { display: block; margin-top: 8px; }
  input, textarea { box-sizing: border-box; width: 100%; padding: 7px; border: 1px solid #ccc; border-radius: 4px; font: inherit; }
  textarea { height: 105px; resize: vertical; }
  button { width: 100%; margin-top: 12px; padding: 9px; border: 0; border-radius: 5px; background: #b87817; color: white; cursor: pointer; }
  button.secondary { margin-top: 7px; background: #eee; color: #555; }
  button:disabled { opacity: .55; cursor: default; }
  #status { max-height: 38vh; overflow: auto; margin-top: 12px; padding: 10px; border: 1px solid #ead7b7; border-radius: 5px; background: #fffaf2; color: #8a5a00; white-space: pre-wrap; }
</style>
<h1>GSXT 企业信用存档助手 <small>1.7.7</small></h1>
<p>企业名称每行一个，支持模糊搜索；自动逐屏保存全页截图；滑块验证码会自动识别，多次失败后需手动完成。首次启动会请求 Chrome 的跨标签截图权限；扩展只处理 GSXT 页面。</p>
<button id="pin" class="secondary">固定到右侧</button>
<label>企业名称或关键词</label>
<textarea id="companies" placeholder="小米科技&#10;华为技术"></textarea>
<label>登录账号（可留空）</label>
<input id="username" autocomplete="username">
<label>登录密码（可留空）</label>
<input id="password" type="password" autocomplete="current-password">
<p>以上内容保存在当前 Chrome 配置的扩展本地数据中。</p>
<div id="status">等待开始任务。</div>
<button id="start">开始执行</button>
<button id="clear" class="secondary">清除已保存信息</button>
<script src="blockers.js"></script>
<script src="popup.js"></script>
